# ===========================================
# KUBERNETES DEPLOYMENT
# ===========================================
# Manages the application pods with:
# - 2 replicas for high availability
# - Rolling update strategy for zero-downtime deployments
# - Resource limits to prevent resource exhaustion
# - Health probes for automatic recovery
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sst-booking-app
  namespace: sst-booking
  labels:
    app: sst-booking-system
spec:
  # Number of pod replicas for high availability
  replicas: 2
  
  # Selector to match pods managed by this deployment
  selector:
    matchLabels:
      app: sst-booking-system
  
  # Rolling update strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Max pods above desired count during update
      maxUnavailable: 0  # Keep all pods running during update
  
  template:
    metadata:
      labels:
        app: sst-booking-system
    spec:
      # Security context - run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      containers:
        - name: sst-booking
          # Image from DockerHub (updated by CI/CD)
          image: sarthakpy/sst-booking-system:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 3000
              protocol: TCP
          
          # Resource limits and requests
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: sst-booking-config
            - secretRef:
                name: sst-booking-secrets
          
          # Liveness probe - restart container if unhealthy
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe - remove from service if not ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
