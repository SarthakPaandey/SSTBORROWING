# ===========================================
# MONGODB DEPLOYMENT (Internal Cluster DB)
# ===========================================
# This manifest provides a standalone MongoDB instance 
# for testing/simulation within the Kind cluster.
# ===========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: sst-booking
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: sst-booking
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
