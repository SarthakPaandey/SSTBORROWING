# ===========================================
# KUBERNETES SECRET (Template)
# ===========================================
# IMPORTANT: This is a TEMPLATE file
# Replace placeholder values with real secrets before applying
# In production, use: kubectl create secret generic ... --from-literal=...
# Or use a secrets manager like HashiCorp Vault, AWS Secrets Manager
apiVersion: v1
kind: Secret
metadata:
  name: sst-booking-secrets
  namespace: sst-booking
  labels:
    app: sst-booking-system
type: Opaque
stringData:
  # MongoDB connection string
  MONGODB_URI: "mongodb://your-mongodb-host:27017/sst-booking"
  # NextAuth secret for JWT signing (generate with: openssl rand -base64 32)
  NEXTAUTH_SECRET: "your-nextauth-secret-here"
  # QR code HMAC secret
  QR_HMAC_SECRET: "your-qr-hmac-secret-here"
