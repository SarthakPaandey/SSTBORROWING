  MONGODB_URI: "MONGODB_URI_PLACEHOLDER"
  # NextAuth secret (Injected during CD)
  NEXTAUTH_SECRET: "NEXTAUTH_SECRET_PLACEHOLDER"
  # QR code HMAC secret (Injected during CD)
  QR_HMAC_SECRET: "QR_HMAC_SECRET_PLACEHOLDER"

